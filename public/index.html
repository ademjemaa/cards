<title>Hindsight</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a station departure board at night. Dark board, ivory ticket-cards dealt in rows, an amber split-flap year counter up top, holographic foil on lucky years. */
:root{
  --board:#111317; --panel:#1a1d22; --flap:#23272e; --line:#2f343c;
  --text:#ece6d8; --muted:#8e8b84; --paper:#f1e9d6; --ink:#1e1c18; --ink-soft:#6b6457;
  --amber:#ffb23e; --amber-deep:#c9831a; --gain:#3fcf86; --loss:#ff5a52;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --cw:112px; --ch:152px; --gap:12px; --bagh:104px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--board);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(1200px 500px at 50% -10%,#1d2128 0%,transparent 70%);}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--flap);border-radius:6px;padding:10px 16px;cursor:pointer;font-weight:600;min-height:44px;transition:transform .12s,background .15s,border-color .15s}
.btn:hover{border-color:#4a505a}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1b1306}
.btn.primary:hover{background:#ffc261}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.small{min-height:34px;padding:6px 12px;font-size:13px}
input[type=text],select{background:var(--board);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:10px 12px;font:inherit;min-height:44px;width:100%}
input[type=text]:focus,select:focus{border-color:var(--amber);outline:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:12px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{font-size:34px;font-weight:900;letter-spacing:.02em}
.brand h1 span{color:var(--amber)}

/* split flap */
.flap{display:inline-flex;gap:4px}
.flap b{display:inline-grid;place-items:center;width:.72em;height:1.12em;background:linear-gradient(#2a2f37 0 49%,#1c2026 51% 100%);border-radius:4px;color:var(--amber);font-family:var(--mono);font-weight:600;position:relative;box-shadow:inset 0 -1px 0 #0006}
.flap b::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#0009}
.flap b.go{animation:flip .38s cubic-bezier(.3,.7,.4,1)}
@keyframes flip{0%{transform:rotateX(0)}45%{transform:rotateX(88deg);filter:brightness(.6)}55%{transform:rotateX(-88deg)}100%{transform:rotateX(0)}}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:36px;align-items:center;padding-block:12px 28px}
.hero h2{font-size:clamp(46px,7vw,88px);font-weight:900;line-height:.9}
.hero h2 em{font-style:normal;color:var(--amber)}
.hero p{max-width:52ch;color:#cfc8b8;font-size:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:8px}
.rules div{border-top:1px solid var(--line);padding-top:12px}
.rules h3{font-size:22px;margin-bottom:6px;color:var(--amber)}
.rules p{margin:0;color:#c3bcad;font-size:14px}
.tables{display:grid;gap:8px}
.tablelink{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:var(--board);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer}
.tablelink:hover{border-color:var(--amber)}
.demo-cards{display:flex;gap:10px;justify-content:center;padding:8px 0 4px;perspective:900px}
.demo-cards .card{transform:rotate(var(--r)) translateY(var(--y));}

/* cards */
.card{width:var(--cw);height:var(--ch);flex:0 0 auto;position:relative;perspective:800px}
.card .in{position:absolute;inset:0;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.open .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;display:flex;flex-direction:column;padding:9px 10px;color:var(--ink);background:var(--paper);box-shadow:0 1px 0 #fff8 inset,0 6px 14px #0007}
.face.back{background:repeating-linear-gradient(135deg,#2a2e35 0 6px,#252930 6px 12px);color:var(--text);border:1px solid #3a3f48;align-items:center;justify-content:center;text-align:center}
.face.front{transform:rotateY(180deg)}
.yr{font-family:var(--display);font-weight:900;font-size:32px;line-height:1;letter-spacing:.01em}
.back .yr{color:var(--amber)}
.tk{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.aname{font-weight:600;font-size:13px;line-height:1.2;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.mult{margin-top:auto;font-family:var(--mono);font-weight:600;font-size:15px}
.mult.up{color:#11804a}.mult.down{color:#c22d27}.mult.flat{color:var(--ink-soft)}
.px{font-family:var(--mono);font-size:10px;color:var(--ink-soft)}
.stamp{position:absolute;inset:auto 6px 38% 6px;transform:rotate(-14deg);border:3px solid var(--loss);color:var(--loss);font-family:var(--display);font-weight:900;font-size:26px;text-align:center;letter-spacing:.08em;border-radius:6px;background:#fff6;opacity:0}
.card.open .stamp{animation:stamp .35s .45s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{from{opacity:0;transform:rotate(-14deg) scale(2.2)}to{opacity:.92;transform:rotate(-14deg) scale(1)}}
.lucky .face.back,.lucky .face.front{background-image:linear-gradient(115deg,#ffd9f2 0%,#c8f1ff 22%,#fff3c1 44%,#d6ffe0 66%,#e2d4ff 88%);background-size:260% 260%;animation:foil 5s linear infinite}
.lucky .face.back{color:var(--ink);border:0}
.lucky.pick .face{background-image:linear-gradient(115deg,#ffd9f2 0%,#c8f1ff 22%,#fff3c1 44%,#d6ffe0 66%,#e2d4ff 88%);background-size:260% 260%;animation:foil 5s linear infinite}
.lucky .face.back .yr{color:var(--ink)}
@keyframes foil{to{background-position:260% 0}}
.badge-lucky{position:absolute;top:7px;right:7px;font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.1em;background:var(--ink);color:#fff3c1;border-radius:3px;padding:2px 5px;z-index:2}
.card.start .face.front{background:var(--amber);}
.card.cur .face{box-shadow:0 0 0 2px var(--amber),0 8px 22px #000a}
.card.shake .in{animation:shake .5s}
@keyframes shake{20%{transform:rotate(-3deg) scale(1.04)}40%{transform:rotate(3deg) scale(1.06)}60%{transform:rotate(-2deg) scale(1.05)}80%{transform:rotate(1deg)}}

/* picking */
.deal{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr));gap:14px}
.pick{cursor:pointer;border:0;padding:0;background:none;text-align:left}
.pick .face{transform:none}
.pick:hover .face{box-shadow:0 0 0 2px var(--amber),0 8px 18px #0008}
.pick .empty{margin-top:auto;font-family:var(--mono);font-size:12px;color:var(--amber-deep);font-weight:600}
.pick .face.unset{background:#e5dcc6}
.statusbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--board) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 18px;padding:12px max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--panel);white-space:nowrap}
.chip.on{border-color:var(--gain);color:var(--gain)}
.chip.host::before{content:"★ ";color:var(--amber)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* picker sheet */
.sheet-bg{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;width:min(720px,100%);height:min(86vh,760px);display:flex;flex-direction:column;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;flex:0 0 auto}
.sheet>input{flex:0 0 auto}
.sheet h3{font-size:30px}
.cats{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0;flex:0 0 auto;border-bottom:1px solid var(--line);margin-bottom:6px;transition:opacity .15s}
.cats.dim{opacity:.45}
.cat{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--board);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer;min-height:34px;line-height:1.2}
.cat .n{font-family:var(--mono);font-size:10px;color:var(--muted)}
.cat.on{background:var(--amber);color:#1b1306;border-color:var(--amber)}
.cat.on .n{color:#5a3a06}
.list{flex:1 1 auto;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:2px;margin-inline:-6px;padding-inline:6px;overscroll-behavior:contain}
.opt{flex:0 0 auto;display:flex;justify-content:space-between;gap:12px;align-items:center;background:none;border:0;border-radius:6px;padding:10px;text-align:left;cursor:pointer;min-height:46px;line-height:1.3;width:100%}
.opt .nm{min-width:0;overflow-wrap:anywhere}
.opt:hover,.opt.sel{background:var(--flap)}
.opt.sel{box-shadow:inset 3px 0 0 var(--amber)}
.opt .c{flex:0 0 auto;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;text-align:right}

/* reveal */
.board-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.board-head .flap{font-size:54px}
.lane{border-top:1px solid var(--line);padding-block:14px 6px}
.lane-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.lane-h .who{font-weight:600;font-size:16px}
.lane-h .amt{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--amber);font-variant-numeric:tabular-nums}
.strip{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding-bottom:10px}
.track{position:relative;display:flex;gap:var(--gap);padding-top:var(--bagh);width:max-content;padding-right:40vw}
.bag{position:absolute;top:0;left:0;width:var(--cw);height:var(--bagh);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transition:left .6s cubic-bezier(.45,0,.25,1);z-index:3;pointer-events:none}
.bag .body{width:74px;height:74px;transform-origin:50% 100%}
.bag.hop .body{animation:hop .6s cubic-bezier(.3,.6,.3,1)}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.12,.86)}50%{transform:translateY(-34px) scale(.95,1.06)}85%{transform:translateY(0) scale(1.1,.9)}100%{transform:none}}
.bag.morph .body{animation:morph .7s cubic-bezier(.2,1.7,.4,1)}
@keyframes morph{0%{transform:scale(.4);filter:brightness(2.4)}100%{transform:scale(1)}}
.bag .tag{font-family:var(--mono);font-size:11px;font-weight:600;background:var(--ink);color:var(--paper);border-radius:3px;padding:1px 6px;margin-top:2px;white-space:nowrap}
.coin{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#f0b52b 55%,#a96c0d);box-shadow:0 0 0 1px #8a5a0a;pointer-events:none;z-index:4}
.reveal{--cw:150px;--ch:214px}
.reveal .aname{-webkit-line-clamp:2}
.reveal .face.front .mult,.reveal .face.front .px{opacity:0;transition:opacity .3s}
.reveal .card.done .face.front .mult,.reveal .card.done .face.front .px{opacity:1}
.spark{position:relative;height:56px;margin:6px -2px 4px;flex:0 0 auto}
.spark svg{width:100%;height:100%;display:block;overflow:visible}
.spark path,.spark line{fill:none;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.spark .live{stroke:var(--ink);stroke-width:2}
.card.done .spark .live{stroke:#11804a}
.card.done.loss .spark .live{stroke:#c22d27}
.spark .ghost{stroke:var(--ink-soft);stroke-width:1.2;opacity:.35}
.spark .base{stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:2 3;opacity:.6}
.spark .flatline{stroke:var(--ink-soft);stroke-width:2}
.spark .dash{stroke:#c22d27;stroke-width:2;stroke-dasharray:4 4;opacity:.6}
.rider{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#f0b52b 55%,#a96c0d);box-shadow:0 0 0 2px #fff8,0 0 10px #f0b52b;left:0;top:50%;opacity:0;transition:opacity .2s}
.card.open .rider{opacity:1}
.card.done .rider{opacity:0}
.rider.dn{background:radial-gradient(circle at 35% 35%,#ffd2cf,#ff5a52 55%,#8f1d18);box-shadow:0 0 0 2px #fff8,0 0 10px #ff5a52}
.mk{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:9px;font-weight:600;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:#fff;z-index:1;opacity:0;transition:opacity .2s .3s}
.card.open .mk{opacity:1}
.mk.buy{background:#11804a}.mk.sell{background:var(--ink)}
.lane-h .amt{transition:color .2s}
.lane-h .amt.upc{color:var(--gain)}.lane-h .amt.dn{color:var(--loss)}
.compact{--cw:94px;--ch:126px;--bagh:86px}
.reveal.compact{--cw:128px;--ch:196px;--bagh:84px}
.reveal.compact .spark{height:48px}
.compact .yr{font-size:26px}.compact .aname{font-size:12px;-webkit-line-clamp:2}
.compact .bag .body{width:60px;height:60px}
.toast-lucky{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:900;font-size:clamp(40px,9vw,96px);color:var(--ink);background:linear-gradient(115deg,#ffd9f2,#c8f1ff,#fff3c1,#d6ffe0,#e2d4ff);background-size:300% 100%;padding:6px 26px;border-radius:10px;z-index:30;animation:lucky 1.3s ease forwards,foil 2s linear infinite;pointer-events:none;white-space:nowrap}
@keyframes lucky{0%{opacity:0;transform:translate(-50%,-50%) scale(.6) rotate(-6deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05) rotate(-3deg)}80%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-3deg)}100%{opacity:0;transform:translate(-50%,-60%) scale(.95) rotate(-3deg)}}

/* results */
.podium{display:grid;gap:10px}
.place{display:grid;grid-template-columns:44px 72px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.place.first{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.place .rank{font-family:var(--display);font-weight:900;font-size:38px;color:var(--muted)}
.place.first .rank{color:var(--amber)}
.place .money{font-family:var(--mono);font-size:20px;font-weight:600;text-align:right}
.place .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400}
.tbl td.n{font-family:var(--mono);text-align:right}
.scroll{overflow-x:auto}
.code{font-family:var(--mono);font-size:44px;font-weight:600;letter-spacing:.22em;color:var(--amber)}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.setgrid label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.handoff{min-height:60vh;display:grid;place-items:center;text-align:center}
.handoff h2{font-size:clamp(44px,8vw,84px)}
.notice{border:1px dashed var(--line);border-radius:8px;padding:12px 14px;color:#c9c2b2;font-size:14px}
.foot{margin-top:40px;color:var(--muted);font-size:12px;max-width:80ch}
@media (max-width:760px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .rules{grid-template-columns:minmax(0,1fr)}
  .board-head .flap{font-size:40px}
  .place{grid-template-columns:30px 52px minmax(0,1fr);}
  .place .money{grid-column:2/-1;text-align:left}
  .brand h1{font-size:28px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<script>
"use strict";
// ---------- data ----------
const ASSETS=DATA.assets.map(([id,name,cat,y0,rows,al])=>({id,name,cat,y0,rows,keys:[name,id,cat,al||''].map(x=>String(x).toLowerCase().replace(/&/g,'').replace(/[^a-z0-9]+/g,'')).join('|')}));
const BY_ID=Object.fromEntries(ASSETS.map(a=>[a.id,a]));
BY_ID.cash={id:'cash',name:'Hold cash',cat:'Cash',y0:0,rows:[],keys:'holdcash|cash'};
const POPULAR=DATA.meta.popular.filter(id=>BY_ID[id]);const POP_RANK=new Set(POPULAR);
const CATS=['Popular','All','Stocks','ETFs','Indices','Metals','Energy','Agriculture','Materials','Crypto','Currencies'];
const CAT_COUNT={};ASSETS.forEach(a=>{CAT_COUNT[a.cat]=(CAT_COUNT[a.cat]||0)+1});
const FIRST_YEAR=1962,LAST_START=2020,LAST_YEAR=2025,MAX_SEATS=8;
const COLORS=['#ffb23e','#4fc3f7','#3fcf86','#ff7aa2','#b388ff','#ffd54f','#ff8a50','#7ee0c3'];

function row(a,year){if(!a||a.id==='cash')return null;const r=a.rows[year-a.y0];return Array.isArray(r)?r:null}
function tickerLabel(a){return /^[a-z]/.test(a.id)||a.id.startsWith('wpu')?a.cat:a.id.replace('=F','').replace('-USD','').replace('=X','').replace('^','')}

// ---------- rng + game ----------
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genGame(cfg,seed){
  const r=rng(seed);
  const start=cfg.start==='r'?FIRST_YEAR+Math.floor(r()*(LAST_START-FIRST_YEAR+1)):+cfg.start;
  const maxN=Math.min(25,LAST_YEAR-start);
  const n=cfg.count==='r'?3+Math.floor(r()*(maxN-2)):Math.max(1,Math.min(+cfg.count,maxN));
  const p=[0,.18,.34][+cfg.luck];let lucky='';
  for(let i=0;i<n;i++)lucky+=r()<p?'1':'0';
  if(p>0&&!lucky.includes('1')){const k=Math.floor(r()*n);lucky=lucky.slice(0,k)+'1'+lucky.slice(k+1)}
  return {id:seed,start,n,lucky,cash:+cfg.cash,phase:'picking',revealAt:0,cfg:{...cfg}};
}
function yearOf(g,i){return g.start+1+i}
function simulate(g,picks){
  let m=g.cash;const steps=[];
  for(let i=0;i<g.n;i++){
    const year=yearOf(g,i),id=picks[i]||'cash',a=BY_ID[id],lucky=g.lucky[i]==='1';
    let mult=1,kind='hold',buy=null,sell=null;
    if(id!=='cash'){const rw=row(a,year);
      if(!rw)kind='fail';else{kind=lucky?'lucky':'normal';buy=lucky?rw[2]:rw[0];sell=lucky?rw[3]:rw[1];mult=sell/buy}}
    const before=m;m=m*mult;steps.push({i,year,id,a,lucky,mult,kind,buy,sell,before,after:m});
  }
  return {final:m,steps};
}
function perfect(g){
  let m=g.cash;const steps=[];
  for(let i=0;i<g.n;i++){const year=yearOf(g,i),lucky=g.lucky[i]==='1';let best=1,bid='cash';
    for(const a of ASSETS){const rw=row(a,year);if(!rw)continue;const x=lucky?rw[3]/rw[2]:rw[1]/rw[0];if(x>best&&isFinite(x)){best=x;bid=a.id}}
    m*=best;steps.push({year,id:bid,mult:best,lucky,after:m})}
  return {final:m,steps};
}

// ---------- formatting ----------
const UNITS=[[1e15,'Q'],[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']];
function compact(v){for(const[u,s]of UNITS)if(v>=u){const x=v/u;return '$'+(x>=100?x.toFixed(0):x>=10?x.toFixed(1):x.toFixed(2))+s}return '$'+v.toFixed(v<10?2:0)}
function full(v){if(v>=1e15)return compact(v);return '$'+Math.round(v).toLocaleString('en-US')}
function pct(x){const p=(x-1)*100;return (p>=0?'+':'')+(Math.abs(p)>=1000?Math.round(p).toLocaleString('en-US'):p.toFixed(Math.abs(p)<10?1:0))+'%'}
function px(v){return v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:0}):v>=1?v.toFixed(2):v.toPrecision(3)}
function tier(v){return v>=1e12?3:v>=1e9?2:v>=1e6?1:0}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

// ---------- state ----------
const S={
  screen:'home',mode:null,nick:store('hs-nick')||'',
  lobby:null,table:null,code:null,joinT:0,isHost:false,peers:[],lastGame:null,
  game:null,cfg:{start:'r',count:'r',luck:'1',cash:'1000'},
  picks:[],locked:false,pickIdx:0,catSel:'Popular',
  local:{players:[],turn:0},
  reveal:null,speed:1,roomOK:null,
};

// ---------- room ----------
// Self-hosted transport: Server-Sent Events down, small JSON POSTs up.
const MYID=(()=>{let v=null;try{v=sessionStorage.getItem('hs-id')}catch(e){}if(!v||!/^[a-z0-9]{6,32}$/.test(v)){v=Math.random().toString(36).slice(2,12)+Math.random().toString(36).slice(2,8);try{sessionStorage.setItem('hs-id',v)}catch(e){}}return v})();
let LOBBY_ES=null,TABLE_ES=null;
function openLobby(){if(LOBBY_ES)return;LOBBY_ES=new EventSource('/lobby');
  LOBBY_ES.onopen=()=>{if(S.roomOK!==true){S.roomOK=true;if(S.screen==='home')render()}};
  LOBBY_ES.onmessage=e=>{try{const d=JSON.parse(e.data);S.lobbyTables=d.tables||[];if(S.screen==='home')drawTables()}catch(err){}};
  LOBBY_ES.onerror=()=>{if(S.roomOK!==false&&LOBBY_ES.readyState===2){S.roomOK=false;if(S.screen==='home')render()}};}
function post(path,body){return fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),keepalive:true}).catch(()=>{})}
openLobby();

function players(){return S.peers.filter(p=>p.presence&&p.presence.nick).slice().sort((a,b)=>(a.presence.t||0)-(b.presence.t||0)||(a.peer<b.peer?-1:1))}
function seated(){return players().slice(0,MAX_SEATS)}
function me(){return S.peers.find(p=>p.sameTab)}
let pChain=Promise.resolve();
function setP(patch){if(!S.table)return;const code=S.code;pChain=pChain.then(()=>post('/presence',{t:code,id:MYID,patch}))}
function advertise(){}

async function enterTable(code,host){
  S.code=code;S.isHost=host;S.joinT=Date.now();S.mode='online';S.peers=[];
  await new Promise(res=>{let done=false;TABLE_ES=new EventSource('/events?t='+code+'&id='+MYID);
    TABLE_ES.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch(err){return}
      S.peers=(d.peers||[]).map(p=>({peer:p.id,presence:p.presence||{},sameTab:p.id===MYID,isMe:p.id===MYID}));
      if(!done){done=true;res()}else sync()};
    TABLE_ES.onerror=()=>{if(!done&&TABLE_ES.readyState===2){done=true;res()}}});
  if(!TABLE_ES||TABLE_ES.readyState===2){toast('Could not join that table. Try again in a moment.');TABLE_ES=null;return}
  S.table=true;
  if(!host&&!S.peers.some(p=>p.presence&&p.presence.host)){/* nobody hosting yet: still join, host may arrive */}
  const g=host?{phase:'setup',cfg:{...S.cfg},id:0}:null;S.game=g;
  setP({nick:S.nick,t:S.joinT,host,game:g,locked:false,picks:null,prog:0});
  S.screen='table';advertise();render();
}
function leaveTable(){if(S.table){post('/leave',{t:S.code,id:MYID});if(TABLE_ES)TABLE_ES.close();TABLE_ES=null}S.table=null;S.isHost=false;S.code=null;S.game=null;S.peers=[];stopReveal();advertise();S.screen='home';S.mode=null;render()}

function sync(){
  const ps=players();const mine=me();
  let hosts=ps.filter(p=>p.presence.host&&p.presence.game);
  if(S.isHost&&hosts.some(h=>!h.sameTab&&(h.presence.t||0)<S.joinT)){S.isHost=false;setP({host:false,game:null})}
  hosts=ps.filter(p=>p.presence.host&&p.presence.game);
  let hostG=null;
  if(S.isHost)hostG=S.game;else if(hosts.length)hostG=hosts[0].presence.game;
  if(!hosts.length&&!S.isHost&&ps.length&&ps[0].sameTab&&S.lastGame){S.isHost=true;S.game=S.lastGame;setP({host:true,game:S.game});hostG=S.game;toast('The host left. You are hosting now.')}
  if(hostG){
    const prev=S.game;S.game=hostG;S.lastGame=hostG;
    if(hostG.phase==='picking'&&S.pickGameId!==hostG.id){S.pickGameId=hostG.id;S.picks=Array(hostG.n).fill(null);S.locked=false;S.pickIdx=0;stopReveal();setP({locked:false,picks:null,prog:0});S.screen='pick'}
    if(hostG.phase==='setup'&&S.screen!=='table'){stopReveal();S.screen='table'}
    if(hostG.phase==='reveal'&&(!S.reveal||S.reveal.id!==hostG.id))startReveal(onlineRoster(hostG),hostG);
  }
  // host: everyone locked -> reveal
  if(S.isHost&&S.game&&S.game.phase==='picking'){
    const seats=seated();const locked=seats.filter(p=>p.presence.locked&&Array.isArray(p.presence.picks)&&p.presence.picks.length===S.game.n);
    if(seats.length&&locked.length===seats.length){S.game={...S.game,phase:'reveal',revealAt:Date.now()+2200};setP({game:S.game});advertise();startReveal(onlineRoster(S.game),S.game)}
  }
  if(S.isHost)advertise();
  if(['table','pick'].includes(S.screen))render();
}
function onlineRoster(g){return seated().filter(p=>p.presence.locked&&Array.isArray(p.presence.picks)&&p.presence.picks.length===g.n).map((p,i)=>({nick:p.presence.nick,color:COLORS[i%COLORS.length],picks:p.presence.picks,me:!!p.sameTab}))}

function lockIn(){
  if(S.picks.some(x=>!x))return;
  if(S.mode==='online'){S.locked=true;setP({locked:true,picks:S.picks.slice(),prog:S.game.n});render();sync();return}

// ---------- picker ----------
let pickerEl=null;
const norm=s=>String(s||'').toLowerCase().replace(/&/g,'').replace(/[^a-z0-9]+/g,'');
function searchAssets(q){
  const n=norm(q);if(!n)return [];
  const scored=[];
  for(const a of ASSETS){const name=norm(a.name),tk=norm(a.id);let sc=-1;
    if(tk===n||name===n)sc=0;else if(tk.startsWith(n)||name.startsWith(n))sc=1;else if(a.keys.includes(n))sc=2;
    if(sc>=0)scored.push([sc,a])}
  scored.sort((x,y)=>x[0]-y[0]||(POP_RANK.has(x[1].id)?-1:0)-(POP_RANK.has(y[1].id)?-1:0)||x[1].name.localeCompare(y[1].name));
  return scored.map(x=>x[1]);
}

    <div class="list" id="pk-list"></div></div>`;
  document.body.appendChild(bg);pickerEl=bg;
  const q=bg.querySelector('#pk-q'),list=bg.querySelector('#pk-list'),catsEl=bg.querySelector('.cats');

    if(s)items=searchAssets(s);
    else if(S.catSel==='Popular')items=[BY_ID.cash,...POPULAR.map(id=>BY_ID[id])];
    else if(S.catSel==='All')items=[BY_ID.cash,...ASSETS];
    else items=ASSETS.filter(a=>a.cat===S.catSel);
    list.innerHTML=items.map(a=>`<button class="opt ${S.picks[i]===a.id?'sel':''}" data-id="${esc(a.id)}"><span class="nm">${esc(a.name)}</span><span class="c">${a.id==='cash'?'no risk · ×1':esc(tickerLabel(a))+(a.cat!==tickerLabel(a)?' · '+esc(a.cat):'')}</span></button>`).join('')||`<p class="muted" style="padding:10px;margin:0">Nothing matches “${esc(s)}”. Try a company, a ticker or a commodity.</p>`;
    list.scrollTop=0;
    list.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.picks[i]=b.dataset.id;progress();closePicker();
      const next=S.picks.findIndex((x,k)=>!x&&k>i);render();if(next>=0)openPicker(next)});
  };
  q.oninput=draw;
  bg.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{S.catSel=b.dataset.c;q.value='';bg.querySelectorAll('.cat').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-selected',x===b)});draw()});
  bg.querySelector('#pk-close').onclick=closePicker;
  bg.onclick=e=>{if(e.target===bg)closePicker()};
  bg.onkeydown=e=>{if(e.key==='Escape')closePicker();if(e.key==='Enter'&&e.target===q){const f=list.querySelector('.opt');if(f)f.click()}};
  draw();if(matchMedia('(pointer:fine)').matches)setTimeout(()=>q.focus({preventScroll:true}),50);
}

        ${p.sim.steps.map(s=>`<div class="card ${s.lucky?'lucky':''}" id="c-${pi}-${s.i}"><div class="in">${cardBack(s.year,s.lucky)}${frontHTML(s)}</div></div>`).join('')}

    <div id="rv-results"></div>`;
  app.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{S.speed=+b.dataset.sp;app.querySelectorAll('[data-sp]').forEach(x=>x.classList.toggle('primary',x===b))});
  app.querySelector('#rv-skip').onclick=()=>{R.skip=true};
  runReveal(R);
}
function frontHTML(s){
  const a=s.a,cls=s.kind==='fail'||s.kind==='hold'?'flat':s.mult>=1?'up':'down';
  const name=a?a.name:'Hold cash';
  const line=s.kind==='fail'?`Not trading in ${s.year}`:s.kind==='hold'?'Sat it out':s.lucky?`bought ${px(s.buy)} · sold ${px(s.sell)}`:`${px(s.buy)} → ${px(s.sell)}`;
  return `<div class="face front">${s.lucky?'<span class="badge-lucky">LUCKY</span>':''}<span class="tk">${a&&a.id!=='cash'?esc(tickerLabel(a)):'CASH'}</span><span class="yr">${s.year}</span><span class="aname">${esc(name)}</span>
    <div class="spark ${s.kind}">${s.kind==='normal'||s.kind==='lucky'?'':`<svg viewBox="0 0 120 52" preserveAspectRatio="none"><line x1="2" y1="26" x2="118" y2="26" class="${s.kind==='fail'?'dash':'flatline'}"/></svg>`}</div>
    <span class="px">${esc(line)}</span>
    <span class="mult ${cls}">${s.kind==='fail'?'×1.00':'×'+(s.mult>=100?s.mult.toFixed(0):s.mult.toFixed(2))} <small>${s.kind==='fail'?'':pct(s.mult)}</small></span>${s.kind==='fail'?'<div class="stamp">FAIL</div>':''}</div>`;
}

// Price path for one asset-year: points {x:0..1, p:price}, plus lucky buy/sell positions.
const B64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
let SERIES=null;
fetch('series.json').then(r=>r.ok?r.json():null).then(d=>{SERIES=d}).catch(()=>{});
function pathFor(id,year){
  if(!SERIES||!SERIES[id])return null;const [y0,rows]=SERIES[id];const r=rows[year-y0];if(!Array.isArray(r))return null;
  const [lo,hi,str,pos]=r,n=str.length;if(n<2)return null;
  const pts=[...str].map((c,i)=>({x:i/(n-1),p:lo+(B64.indexOf(c)/63)*(hi-lo)}));
  const lp=pos&&pos.length===2?[B64.indexOf(pos[0])/63,B64.indexOf(pos[1])/63]:null;
  return {lo,hi,pts,lp};
}
function priceAt(pts,x){if(x<=0)return pts[0].p;if(x>=1)return pts[pts.length-1].p;const f=x*(pts.length-1),i=Math.floor(f),t=f-i;return pts[i].p+(pts[i+1].p-pts[i].p)*t}
const CW=120,CH=52,PAD=4;
// Builds the chart inside a card and returns a function play(progress 0..1) -> current money.
function buildChart(card,s){
  const box=card.querySelector('.spark');if(!box||!(s.kind==='normal'||s.kind==='lucky'))return null;
  const P=pathFor(s.id,s.year);if(!P)return null;
  let lo=P.lo,hi=P.hi;if(s.lucky){lo=Math.min(lo,s.buy);hi=Math.max(hi,s.sell)}
  const Y=v=>hi>lo?PAD+(1-(v-lo)/(hi-lo))*(CH-2*PAD):CH/2, X=x=>PAD+x*(CW-2*PAD);
  const d=P.pts.map((q,i)=>(i?'L':'M')+X(q.x).toFixed(2)+' '+Y(q.p).toFixed(2)).join('');
  let a0=0,a1=1;if(s.lucky&&P.lp){a0=P.lp[0];a1=Math.max(P.lp[1],a0)}
  const sub=[];const n=P.pts.length;sub.push([a0,s.lucky?s.buy:priceAt(P.pts,a0)]);
  P.pts.forEach(q=>{if(q.x>a0&&q.x<a1)sub.push([q.x,q.p])});sub.push([a1,s.lucky?s.sell:priceAt(P.pts,a1)]);
  const dsub=sub.map((q,i)=>(i?'L':'M')+X(q[0]).toFixed(2)+' '+Y(q[1]).toFixed(2)).join('');
  box.innerHTML=`<svg viewBox="0 0 ${CW} ${CH}" preserveAspectRatio="none">
      <line x1="${PAD}" x2="${CW-PAD}" y1="${Y(s.lucky?s.buy:P.pts[0].p).toFixed(2)}" y2="${Y(s.lucky?s.buy:P.pts[0].p).toFixed(2)}" class="base"/>
      ${s.lucky?`<path d="${d}" class="ghost"/>`:''}<path d="${dsub}" class="live"/></svg>
    <span class="rider"></span>${s.lucky?`<span class="mk buy" style="left:${(X(a0)/CW*100).toFixed(1)}%;top:${(Y(s.buy)/CH*100).toFixed(1)}%">B</span><span class="mk sell" style="left:${(X(a1)/CW*100).toFixed(1)}%;top:${(Y(s.sell)/CH*100).toFixed(1)}%">S</span>`:''}`;
  const live=box.querySelector('.live'),rider=box.querySelector('.rider');
  // cumulative length along the sub path (in viewBox units) for the draw-on effect
  const seg=[0];for(let i=1;i<sub.length;i++){const dx=X(sub[i][0])-X(sub[i-1][0]),dy=Y(sub[i][1])-Y(sub[i-1][1]);seg.push(seg[i-1]+Math.hypot(dx,dy))}
  const total=seg[seg.length-1]||1;live.style.strokeDasharray=total;live.style.strokeDashoffset=total;
  const buyP=sub[0][1];
  return k=>{ // k: 0..1 progress through the held period
    const x=a0+(a1-a0)*k;let i=1;while(i<sub.length-1&&sub[i][0]<x)i++;
    const s0=sub[i-1],s1=sub[i],t=s1[0]>s0[0]?(x-s0[0])/(s1[0]-s0[0]):1,p=s0[1]+(s1[1]-s0[1])*Math.min(1,Math.max(0,t));
    const len=seg[i-1]+(seg[i]-seg[i-1])*Math.min(1,Math.max(0,t));live.style.strokeDashoffset=total-len;
    rider.style.left=(X(x)/CW*100)+'%';rider.style.top=(Y(p)/CH*100)+'%';
    const money=k>=1?s.after:s.before*p/buyP;
    rider.classList.toggle('dn',money<s.before);card.classList.toggle('falling',money<s.before);
    return money;
  };
}
function setYear(y,label){
  const el=document.getElementById('rv-year');if(!el)return;const str=String(y);
  [...el.children].forEach((b,i)=>{if(b.textContent!==str[i]){b.textContent=str[i];b.classList.remove('go');void b.offsetWidth;b.classList.add('go')}});
  const l=document.getElementById('rv-label');if(l)l.textContent=label;
}
function rollNumber(el,tagEl,from,to,ms){
  return new Promise(res=>{const t0=performance.now();const lf=Math.log(Math.max(from,1e-9)),lt=Math.log(Math.max(to,1e-9));
    const f=t=>{const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3);const v=Math.exp(lf+(lt-lf)*e);
      if(el)el.textContent=full(v);if(tagEl)tagEl.textContent=compact(v);if(k<1)requestAnimationFrame(f);else res()};requestAnimationFrame(f)})}
function coins(bag,n){const r=bag.getBoundingClientRect();for(let i=0;i<n;i++){const c=document.createElement('div');c.className='coin';c.style.position='fixed';c.style.left=(r.left+r.width/2-6)+'px';c.style.top=(r.top+r.height*0.55)+'px';document.body.appendChild(c);
  const dx=(Math.random()-.5)*160,dy=-60-Math.random()*90;c.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx*.6}px,${dy}px) scale(1.1)`,opacity:1,offset:.45},{transform:`translate(${dx}px,${dy+130}px) scale(.7)`,opacity:0}],{duration:900+Math.random()*400,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>c.remove()}}
// Runs every lane's chart together; the lane total and bag tag follow the rider.
function rideCharts(lanes,i,ms,R){
  const plays=lanes.map((L,pi)=>{const s=L.p.sim.steps[i];const card=document.getElementById(`c-${pi}-${i}`);return {L,s,card,play:buildChart(card,s)}});
  if(R.skip){plays.forEach(o=>{if(o.play)o.play(1);o.card.classList.add('done');o.card.classList.toggle('loss',o.s.mult<1);o.card.classList.remove('falling');o.L.amt.textContent=full(o.s.after);o.L.tag.textContent=compact(o.s.after)});return Promise.resolve()}
  return new Promise(res=>{const t0=performance.now();
    const f=t=>{if(R.dead)return res();const k=Math.min(1,(t-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      plays.forEach(o=>{let m;
        if(o.play)m=o.play(e);
        else m=o.s.kind==='normal'||o.s.kind==='lucky'?Math.exp(Math.log(o.s.before)+(Math.log(o.s.after)-Math.log(o.s.before))*e):o.s.after;
        o.L.amt.textContent=full(m);o.L.tag.textContent=compact(m);
        o.L.amt.classList.toggle('dn',m<o.s.before);o.L.amt.classList.toggle('upc',m>o.s.before)});
      if(k<1)requestAnimationFrame(f);else{plays.forEach(o=>{o.card.classList.add('done');o.card.classList.toggle('loss',o.s.mult<1);o.card.classList.remove('falling');o.L.amt.textContent=full(o.s.after);o.L.tag.textContent=compact(o.s.after)});res()}};
    requestAnimationFrame(f)});
}
async function runReveal(R){
  const g=R.g,wait=Math.max(0,(g.revealAt||0)-Date.now());
  const W=ms=>R.skip?Promise.resolve():sleep(ms/S.speed);
  if(wait>0&&!R.skip){setYear(g.start,'Departing from');await sleep(Math.min(wait,6000))}
  const lanes=R.roster.map((p,pi)=>({p,strip:document.getElementById('strip-'+pi),bag:document.getElementById('bag-'+pi),amt:document.getElementById('amt-'+pi),tag:document.getElementById('tag-'+pi),money:g.cash,tier:tier(g.cash)}));
  const cw=()=>{const c=document.getElementById('c-0-s');const gap=parseFloat(getComputedStyle(c.parentElement).columnGap)||12;return c?c.getBoundingClientRect().width+gap:160};
  await W(700);
  for(let i=0;i<g.n;i++){
    if(R.dead)return;R.step=i;const year=yearOf(g,i),lucky=g.lucky[i]==='1';
    setYear(year,lucky?'Lucky year':'Now trading');
    const w=cw();
    lanes.forEach(L=>{L.strip.scrollTo({left:Math.max(0,(i+1)*w-w*1.3),behavior:R.skip?'auto':'smooth'})});
    if(lucky&&!R.skip){const t=document.createElement('div');t.className='toast-lucky';t.textContent='LUCKY '+year;document.body.appendChild(t);setTimeout(()=>t.remove(),1400);
      lanes.forEach((L,pi)=>document.getElementById(`c-${pi}-${i}`).classList.add('shake'));await W(1100)}
    // flip every lane's card, then hop the bag onto it
    lanes.forEach((L,pi)=>{const c=document.getElementById(`c-${pi}-${i}`);setTimeout(()=>c&&c.classList.add('open'),R.skip?0:pi*90/S.speed)});
    await W(600+lanes.length*60);
    lanes.forEach((L,pi)=>{document.querySelectorAll(`[id^="c-${pi}-"]`).forEach(c=>c.classList.remove('cur'));const c=document.getElementById(`c-${pi}-${i}`);c&&c.classList.add('cur');
      L.bag.style.left=((i+1)*w)+'px';L.bag.classList.remove('hop');void L.bag.offsetWidth;L.bag.classList.add('hop')});
    await W(560);
    // the year plays out on the chart; money rides the line
    await rideCharts(lanes,i,(lucky?2300:1800)/S.speed,R);
    if(R.dead)return;
    lanes.forEach(L=>{const s=L.p.sim.steps[i];L.money=s.after;
      const nt=tier(L.money);if(nt!==L.tier){L.tier=nt;L.bag.querySelector('.bagwrap').innerHTML=bagHTML(nt);L.bag.classList.remove('morph');void L.bag.offsetWidth;L.bag.classList.add('morph');if(!R.skip)coins(L.bag,22)}
      else if(s.mult>=1.5&&!R.skip)coins(L.bag,Math.min(16,Math.round(s.mult*3)))});
    await W(lucky?800:520);
  }
  if(R.dead)return;
  lanes.forEach(L=>{L.amt.classList.remove('dn','upc')});
  setYear(yearOf(g,g.n-1),'Arrived');
  showResults(R);
}
function showResults(R){
  const g=R.g,box=document.getElementById('rv-results');if(!box)return;
  const ranked=R.roster.map(p=>{const st=p.sim.steps;const best=st.reduce((b,s)=>s.mult>(b?b.mult:0)?s:b,null);const fails=st.filter(s=>s.kind==='fail').length;return {...p,final:p.sim.final,best,fails}}).sort((a,b)=>b.final-a.final);
  const perf=perfect(g);
  box.innerHTML=`<section class="stack" style="margin-top:28px;gap:16px">
    <div class="row" style="justify-content:space-between"><h2 style="font-size:clamp(36px,6vw,58px)">Final ledger</h2>
      <div class="row">${S.mode==='online'?(S.isHost?`<button class="btn primary" id="again">Deal again</button><button class="btn" id="settings">Change settings</button>`:`<span class="muted">The host can deal another round.</span>`)+`<button class="btn ghost" id="leave2">Leave table</button>`:`<button class="btn primary" id="again">Play again</button><button class="btn" id="home">Main menu</button>`}</div></div>
    <div class="podium">${ranked.map((p,k)=>`<div class="place ${k===0?'first':''}"><span class="rank">${k+1}</span><svg viewBox="0 0 100 100" width="64" height="64" aria-hidden="true"><use href="#bag${tier(p.final)}"/></svg>
      <div style="min-width:0"><div style="font-weight:600"><span class="dot" style="background:${p.color}"></span>${esc(p.nick)}${p.me?' (you)':''}</div>
      <div class="sub">${p.best&&p.best.mult>1?`Best call: ${esc(p.best.a?p.best.a.name:'')} in ${p.best.year} (${pct(p.best.mult)})`:'No winning years'}${p.fails?` · ${p.fails} fail${p.fails>1?'s':''}`:''}</div></div>
      <span class="money">${full(p.final)}</span></div>`).join('')}</div>
    <details class="panel"><summary style="cursor:pointer;font-weight:600">A perfect time traveler would have ended with <span class="mono" style="color:var(--amber)">${full(perf.final)}</span></summary>
      <div class="scroll" style="margin-top:12px"><table class="tbl"><thead><tr><th>Year</th><th>Best pick</th><th style="text-align:right">Gain</th><th style="text-align:right">Fortune</th></tr></thead><tbody>
      ${perf.steps.map(s=>`<tr><td class="mono">${s.year}${s.lucky?' ✦':''}</td><td>${esc(BY_ID[s.id].name)}</td><td class="n">${pct(s.mult)}</td><td class="n">${full(s.after)}</td></tr>`).join('')}
      </tbody></table></div><p class="muted" style="font-size:12px;margin:10px 0 0">✦ lucky year: best entry and exit within that year.</p></details>
  </section>`;
  S.screen='results';
  box.scrollIntoView({behavior:'smooth',block:'start'});
  const again=box.querySelector('#again');
  if(again)again.onclick=()=>{if(S.mode==='online'){S.game=genGame(S.game.cfg||S.cfg,(Math.random()*2**31)|0||7);stopReveal();S.screen='pick';setP({game:S.game});sync()}
    else{S.game=genGame(S.cfg,(Math.random()*2**31)|0||7);S.local.players.forEach(p=>p.picks=null);S.local.turn=0;stopReveal();S.screen='handoff';render()}};
  const st=box.querySelector('#settings');if(st)st.onclick=()=>{S.game={phase:'setup',cfg:S.game.cfg||S.cfg,id:0};stopReveal();S.screen='table';setP({game:S.game});advertise();render()};
  const lv=box.querySelector('#leave2');if(lv)lv.onclick=leaveTable;
  const hm=box.querySelector('#home');if(hm)hm.onclick=()=>{stopReveal();S.screen='home';S.mode=null;render()};
}
render();
</script>
